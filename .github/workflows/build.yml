name: Build release binaries

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86-64, avx2-bmi2]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release binary
        run: make "${{ matrix.target }}"

      - name: Run benchmark smoke test
        run: ./surveyor bench

      - name: Name binary for upload
        run: mv surveyor "surveyor-dev-linux-${{ matrix.target }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: surveyor-dev-linux-${{ matrix.target }}
          path: surveyor-dev-linux-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86-64, avx2-bmi2]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Build release binary
        shell: msys2 {0}
        run: make "${{ matrix.target }}"

      - name: Run benchmark smoke test
        shell: msys2 {0}
        run: ./surveyor.exe bench

      - name: Name binary for upload
        shell: msys2 {0}
        run: mv surveyor.exe "surveyor-dev-windows-${{ matrix.target }}.exe"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: surveyor-dev-windows-${{ matrix.target }}.exe
          path: surveyor-dev-windows-${{ matrix.target }}.exe
          if-no-files-found: error
          retention-days: 30
